<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#27133f"/>
      <stop offset="48%" stop-color="#120b27"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>

    <linearGradient id="ring" x1="60" y1="75" x2="452" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71e6ff"/>
      <stop offset="42%" stop-color="#b56cff"/>
      <stop offset="100%" stop-color="#ff5eb7"/>
    </linearGradient>

    <linearGradient id="letters" x1="112" y1="156" x2="405" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7eaff"/>
      <stop offset="45%" stop-color="#c896ff"/>
      <stop offset="100%" stop-color="#ff69b6"/>
    </linearGradient>

    <linearGradient id="petal" x1="-20" y1="-30" x2="24" y2="20">
      <stop offset="0%" stop-color="#fff0fb"/>
      <stop offset="55%" stop-color="#ff99ce"/>
      <stop offset="100%" stop-color="#d85dff"/>
    </linearGradient>

    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.55
                0 0.4 0 0 0.10
                0 0 1 0 0.75
                0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="210"/>
    </clipPath>
  </defs>

  <!-- Transparent outside edge -->
  <circle cx="256" cy="256" r="220" fill="#9b61ff" opacity="0.16" filter="url(#outerGlow)"/>
  <circle cx="256" cy="256" r="212" fill="url(#bg)" stroke="url(#ring)" stroke-width="8"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Tiny night-sky accents -->
  <g clip-path="url(#badgeClip)" fill="#ffffff">
    <circle cx="104" cy="192" r="2.4" opacity="0.78"/>
    <circle cx="414" cy="169" r="2.1" opacity="0.62"/>
    <circle cx="383" cy="104" r="1.8" opacity="0.8"/>
    <circle cx="124" cy="331" r="1.7" opacity="0.55"/>
    <path d="M411 313 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.62"/>
    <path d="M103 117 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity="0.48"/>
  </g>

  <!-- JA monogram -->
  <g fill="none" stroke="url(#letters)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- J -->
    <path d="M190 168 L190 288 C190 342 158 365 116 345"/>
    <!-- A -->
    <path d="M246 350 L321 166 L397 350"/>
    <path d="M276 282 H368"/>
  </g>

  <!-- Sakura flower -->
  <g transform="translate(188 117)" filter="url(#softGlow)">
    <g fill="url(#petal)">
      <path d="M0 -35 C18 -35 27 -18 19 -3 C14 7 5 13 0 18 C-5 13 -14 7 -19 -3 C-27 -18 -18 -35 0 -35 Z"/>
      <path d="M0 -35 C18 -35 27 -18 19 -3 C14 7 5 13 0 18 C-5 13 -14 7 -19 -3 C-27 -18 -18 -35 0 -35 Z" transform="rotate(72)"/>
      <path d="M0 -35 C18 -35 27 -18 19 -3 C14 7 5 13 0 18 C-5 13 -14 7 -19 -3 C-27 -18 -18 -35 0 -35 Z" transform="rotate(144)"/>
      <path d="M0 -35 C18 -35 27 -18 19 -3 C14 7 5 13 0 18 C-5 13 -14 7 -19 -3 C-27 -18 -18 -35 0 -35 Z" transform="rotate(216)"/>
      <path d="M0 -35 C18 -35 27 -18 19 -3 C14 7 5 13 0 18 C-5 13 -14 7 -19 -3 C-27 -18 -18 -35 0 -35 Z" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="8.5" fill="#ffd27a"/>
    <circle cx="-2.5" cy="-2.5" r="3" fill="#fff6c7" opacity="0.9"/>
  </g>

  <!-- A tiny cyan accent for Tokyo-neon balance -->
  <path d="M404 230 C425 240 432 257 431 277" fill="none" stroke="#71e6ff" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
</svg>
